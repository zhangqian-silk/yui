name: Core CI

# Build once per job. Business contracts/wiring run once; native and
# OS process boundaries run on their relevant platforms. No real Provider.

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Independent of package smoke: both must pass in the same Core CI run.
  verify-business:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/install-repository-dependencies
        with:
          node-version: "24"

      - name: Build
        run: npm run build

      - name: Business contracts
        run: npm run test:business

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/install-repository-dependencies
        with:
          node-version: ${{ matrix.node }}

      - name: Build
        run: npm run build

      - name: Verify native dependencies
        run: node scripts/ci-native-dependencies.mjs verify

      - name: Platform contracts
        run: npm run test:platform

      - name: Install tmux for isolated runtime smoke
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux

      - name: Package structure and normal runtime path
        run: |
          node scripts/assemble-runtime-package.mjs --output .release-stage
          npm pack ./.release-stage --dry-run --ignore-scripts --json > package-smoke.json
          node scripts/check-runtime-package-structure.mjs package-smoke.json
          profile=compatibility
          if [ "${{ matrix.node }}" = 24 ]; then profile=full; fi
          node scripts/smoke-runtime-package.mjs --assembled .release-stage --profile "$profile"

  verify-macos:
    strategy:
      matrix:
        os: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/install-repository-dependencies
        with:
          node-version: "24"

      - name: Install tmux
        run: brew install tmux

      - name: Build native owner and core runtime
        run: npm run build

      - name: Verify native dependencies
        run: node scripts/ci-native-dependencies.mjs verify

      - name: Platform contracts
        run: npm run test:platform

      - name: Package structure and normal runtime path
        run: |
          node scripts/assemble-runtime-package.mjs --output .release-stage
          npm pack ./.release-stage --dry-run --ignore-scripts --json > package-smoke.json
          node scripts/check-runtime-package-structure.mjs package-smoke.json
          node scripts/smoke-runtime-package.mjs --assembled .release-stage --profile lifecycle
