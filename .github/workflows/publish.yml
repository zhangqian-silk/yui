name: Publish npm package

# Release evidence contract (see docs/testing/verification-levels.md):
# release never re-runs the broader diagnostic suite. The exact tagged commit
# already passed the bounded core gate in ci.yml; this workflow only adds
# release-specific evidence: tag/version identity, the artifact's structure and
# executable bit, a fresh install across the supported Node matrix, and npm
# provenance. The build job assembles one tarball from the exact tagged commit;
# smoke and publish consume that same artifact, verified by SHA-256.

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reuse the PR/master-gated exact commit
        shell: bash
        run: |
          # A release tag must point at a master commit. Ancestry alone does
          # not prove the bounded Core CI passed for this exact SHA;
          # the next step checks the GitHub Actions result.
          git fetch origin master
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "Tag ${GITHUB_REF_NAME} points at $(git rev-parse HEAD), which is not on master." >&2
            echo "Releases reuse the exact commit that passed the PR/master gate." >&2
            exit 1
          fi
          echo "Releasing master-gated commit $(git rev-parse HEAD)"

      - name: Verify exact commit passed Core CI
        shell: bash
        env:
          # gh is not auto-authenticated by github.token in Actions; without
          # this export every tag release stops at `gh run list` below.
          GH_TOKEN: ${{ github.token }}
        run: |
          # A skipped, cancelled, or bypassed core gate leaves no successful
          # ci.yml run for this exact master SHA and fails the release here.
          head_sha="$(git rev-parse HEAD)"
          run_id="$(gh run list --workflow=ci.yml --commit "$head_sha" --branch master --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -z "$run_id" ]; then
            echo "No successful Core CI run found for $head_sha on master." >&2
            echo "Releases reuse the exact commit that passed the PR/master gate." >&2
            exit 1
          fi
          echo "Core CI run $run_id passed for $head_sha"

      - name: Install dependencies
        uses: ./.github/actions/install-repository-dependencies
        with:
          node-version: "24"

      - name: Verify release tag
        run: npm run verify:release-tag

      - name: Build
        run: npm run build

      - name: Assemble and pack
        run: |
          node scripts/assemble-runtime-package.mjs --output .release-stage
          npm pack ./.release-stage --json > pack-result.json
          node -e 'const fs=require("node:fs"); const result=JSON.parse(fs.readFileSync("pack-result.json","utf8")); fs.renameSync(result[0].filename, "yui-runtime.tgz");'

      - name: Verify package contents
        run: |
          node scripts/check-runtime-package-structure.mjs pack-result.json
          tar -tf yui-runtime.tgz > package-files.txt
          node -e 'const {execFileSync}=require("node:child_process"); const pkg=JSON.parse(execFileSync("tar",["-xOf","yui-runtime.tgz","package/package.json"],{encoding:"utf8"})); if (pkg.private !== false || "scripts" in pkg || "devDependencies" in pkg) throw new Error("runtime manifest must be publishable and lifecycle-free");'
          grep -qx 'package/dist/cli.js' package-files.txt
          grep -qx 'package/dist/cli/commandCatalog.js' package-files.txt
          grep -qx 'package/dist/controller/controllerMain.js' package-files.txt
          grep -qx 'package/dist/output/terminal.js' package-files.txt
          grep -qx 'package/ARCHITECTURE.md' package-files.txt
          grep -qx 'package/i18n/README.zh-CN.md' package-files.txt
          grep -qx 'package/skills/yui-leader/SKILL.md' package-files.txt
          grep -qx 'package/skills/yui-worker/SKILL.md' package-files.txt
          grep -qx 'package/skills/yui-operator/SKILL.md' package-files.txt
          grep -qx 'package/skills/yui-reviewer/SKILL.md' package-files.txt
          grep -qx 'package/skills/yui-runtime/SKILL.md' package-files.txt
          # Five entrypoints plus their packaged, on-demand references.
          if [ "$(grep -Ec '^package/skills/[^/]+/SKILL\.md$' package-files.txt)" -ne 5 ]; then exit 1; fi
          if grep -Eq '^package/(binding\.gyp|native/|build/|scripts/|test/)' package-files.txt; then exit 1; fi
          # The executable bit must survive into the actual tarball, not only
          # the npm pack manifest (PR #110 regression contract).
          test "$(tar -tvf yui-runtime.tgz | awk '$NF=="package/dist/cli.js"{print $1}')" = "-rwxr-xr-x"

      - name: Record artifact provenance
        run: |
          sha256sum yui-runtime.tgz | tee yui-runtime.sha256
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "tag=${GITHUB_REF_NAME}"
            cat yui-runtime.sha256
          } | tee release-provenance.txt

      - name: Upload tested package
        uses: actions/upload-artifact@v7
        with:
          name: yui-runtime-tarball
          path: |
            yui-runtime.tgz
            yui-runtime.sha256
            release-provenance.txt
          if-no-files-found: error
          retention-days: 7

  smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux

      - name: Download tested package
        uses: actions/download-artifact@v8
        with:
          name: yui-runtime-tarball
          path: release-artifact

      - name: Verify artifact provenance
        run: |
          cd release-artifact
          sha256sum -c yui-runtime.sha256

      - name: Install and exercise the package
        run: |
          YUI_TGZ="$PWD/release-artifact/yui-runtime.tgz"
          consumer="$(mktemp -d)"
          npm install --prefix "$consumer" "$YUI_TGZ"
          YUI_INSTALLED_ROOT="$consumer/node_modules/@zq-silk/yui" node scripts/smoke-runtime-package.mjs

  publish:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Download tested package
        uses: actions/download-artifact@v8
        with:
          name: yui-runtime-tarball
          path: release-artifact

      - name: Verify artifact provenance
        run: |
          cd release-artifact
          sha256sum -c yui-runtime.sha256

      - name: Publish tested package
        # Stable releases advance latest; prereleases remain on next.
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          dist_tag=latest
          if [[ "$RELEASE_TAG" == *-* ]]; then dist_tag=next; fi
          npm publish ./release-artifact/yui-runtime.tgz --access public --provenance --tag "$dist_tag"

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    concurrency:
      group: github-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Download tested release artifact
        uses: actions/download-artifact@v8
        with:
          name: yui-runtime-tarball
          path: release-artifact

      - name: Publish and verify durable release assets
        shell: bash
        working-directory: release-artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha256sum -c yui-runtime.sha256
          grep -Fx "commit=$RELEASE_COMMIT" release-provenance.txt
          grep -Fx "tag=$RELEASE_TAG" release-provenance.txt
          prerelease=false
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=true; fi
          if ! gh release view "$RELEASE_TAG" --json isDraft,isPrerelease > release.json; then
            create_args=("$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes)
            if [ "$prerelease" = true ]; then
              create_args+=(--prerelease --latest=false)
            else
              create_args+=(--latest)
            fi
            gh release create "${create_args[@]}"
            gh release view "$RELEASE_TAG" --json isDraft,isPrerelease > release.json
          fi
          test "$(jq -r .isPrerelease release.json)" = "$prerelease"
          draft="$(jq -r .isDraft release.json)"
          assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          verified="$(mktemp -d)"
          trap 'rmdir "$verified" 2>/dev/null || true' EXIT
          for asset in yui-runtime.tgz yui-runtime.sha256 release-provenance.txt; do
            if ! grep -Fxq "$asset" <<< "$assets"; then
              # Never change a published release or clobber an existing asset.
              test "$draft" = true
              gh release upload "$RELEASE_TAG" "$asset"
            fi
            gh release download "$RELEASE_TAG" --pattern "$asset" --dir "$verified"
            cmp "$asset" "$verified/$asset"
            rm "$verified/$asset"
          done
          if [ "$draft" = true ]; then
            if [ "$prerelease" = true ]; then
              gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false --verify-tag
            else
              gh release edit "$RELEASE_TAG" --draft=false --latest --verify-tag
            fi
          fi
